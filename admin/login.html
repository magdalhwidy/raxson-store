<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | لوحة التحكم</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --color-primary: #7B49FF;
            --color-primary-dark: #5A2DD6;
            --color-secondary: #FF2C79;
            --color-accent: #00FFD0;
            --bg-primary: #0A0A1A;
            --bg-surface: #1A1A3E;
            --bg-surface-hover: #252550;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0C0;
            --text-muted: #606080;
            --color-error: #FF3366;
            --color-success: #00FFD0;
            --border-subtle: 1px solid rgba(123, 73, 255, 0.1);
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 50px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            overflow: hidden;
            position: relative;
        }

        /* Background Effects */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 30%, rgba(123, 73, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(255, 44, 121, 0.08) 0%, transparent 50%);
            animation: rotateBg 30s linear infinite;
            z-index: 0;
        }

        @keyframes rotateBg {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Login Container */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: var(--space-lg);
        }

        /* Login Card */
        .login-card {
            background: rgba(26, 26, 62, 0.8);
            backdrop-filter: blur(30px);
            border: var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(123, 73, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--color-primary), var(--color-secondary));
        }

        /* Logo */
        .login-logo {
            text-align: center;
            margin-bottom: var(--space-xl);
        }

        .login-logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-md);
            font-size: 28px;
            color: white;
            box-shadow: 0 0 30px rgba(123, 73, 255, 0.3);
        }

        .login-logo h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-logo p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: var(--space-sm);
        }

        /* Form */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }

        .form-group {
            position: relative;
        }

        .form-label {
            display: block;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: var(--space-sm);
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: var(--space-md) var(--space-lg);
            padding-right: 48px;
            background: rgba(10, 10, 26, 0.6);
            border: 1px solid rgba(123, 73, 255, 0.2);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            transition: var(--transition-fast);
            outline: none;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 15px rgba(123, 73, 255, 0.2);
        }

        .form-input-icon {
            position: absolute;
            right: var(--space-md);
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            transition: var(--transition-fast);
        }

        .form-group:focus-within .form-input-icon {
            color: var(--color-primary);
        }

        /* Password Toggle */
        .password-toggle {
            position: absolute;
            left: var(--space-md);
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            transition: var(--transition-fast);
        }

        .password-toggle:hover {
            color: var(--color-primary);
        }

        /* Error Message */
        .error-message {
            display: none;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-md);
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.3);
            border-radius: var(--radius-md);
            color: var(--color-error);
            font-size: 14px;
        }

        .error-message.show {
            display: flex;
        }

        .error-message i {
            font-size: 18px;
            flex-shrink: 0;
        }

        /* Submit Button */
        .btn-login {
            width: 100%;
            padding: var(--space-md);
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: var(--transition-normal);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
        }

        .btn-login:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(123, 73, 255, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-login .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .btn-login.loading .spinner {
            display: block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: var(--space-xl);
            color: var(--text-muted);
            font-size: 13px;
        }

        .login-footer a {
            color: var(--color-primary);
            text-decoration: none;
        }

        /* Lockout Message */
        .lockout-message {
            display: none;
            text-align: center;
            padding: var(--space-lg);
            color: var(--color-error);
        }

        .lockout-message.show {
            display: block;
        }

        .lockout-message i {
            font-size: 48px;
            margin-bottom: var(--space-md);
        }

        /* Particles Canvas */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: var(--space-md);
            }

            .login-card {
                padding: var(--space-lg);
            }

            .login-logo h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>

    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="login-logo">
                <div class="login-logo-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h1>لوحة التحكم</h1>
                <p>تسجيل الدخول للمتابعة</p>
            </div>

            <!-- Lockout Message -->
            <div class="lockout-message" id="lockoutMessage">
                <i class="fas fa-lock"></i>
                <h3>الحساب مقفل مؤقتاً</h3>
                <p>لقد تجاوزت عدد المحاولات المسموحة. حاول مرة أخرى بعد 30 دقيقة.</p>
            </div>

            <!-- Login Form -->
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label">اسم المستخدم</label>
                    <i class="fas fa-user form-input-icon"></i>
                    <input 
                        type="text" 
                        class="form-input" 
                        id="username" 
                        placeholder="أدخل اسم المستخدم"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label">كلمة المرور</label>
                    <i class="fas fa-lock form-input-icon"></i>
                    <input 
                        type="password" 
                        class="form-input" 
                        id="password" 
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="password-toggle" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <div class="error-message" id="errorMessage">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText"></span>
                </div>

                <button type="submit" class="btn-login" id="submitBtn">
                    <span class="btn-text">تسجيل الدخول</span>
                    <div class="spinner"></div>
                </button>
            </form>

            <!-- Footer -->
            <div class="login-footer">
                <p>Shop Store Admin v1.0</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="js/admin/auth.js"></script>
    <script src="js/admin/sidebar.js"></script>
    <script>
        (function() {
            'use strict';

            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const togglePassword = document.getElementById('togglePassword');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const submitBtn = document.getElementById('submitBtn');
            const lockoutMessage = document.getElementById('lockoutMessage');

            // Toggle password visibility
            togglePassword?.addEventListener('click', () => {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                togglePassword.querySelector('i').className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
            });

            // Handle login
            loginForm?.addEventListener('submit', async (e) => {
                e.preventDefault();

                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username || !password) {
                    showError('يرجى إدخال اسم المستخدم وكلمة المرور');
                    return;
                }

                // Show loading
                submitBtn.classList.add('loading');
                submitBtn.disabled = true;
                hideError();

                try {
                    const result = await AuthAPI.login(username, password);

                    if (result.success) {
                        // Redirect based on role
                        window.location.href = result.redirect || 'dashboard.html';
                    } else {
                        showError(result.error);

                        if (result.code === 'DEVICE_MISMATCH') {
                            showError('هذا الحساب مرتبط بجهاز آخر. تواصل مع المدير لإعادة الضبط.');
                        }
                    }
                } catch (error) {
                    showError('حدث خطأ غير متوقع. حاول مرة أخرى.');
                    console.error('Login error:', error);
                } finally {
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            });

            function showError(message) {
                errorText.textContent = message;
                errorMessage.classList.add('show');
            }

            function hideError() {
                errorMessage.classList.remove('show');
            }

            // Check if already logged in
            const session = AuthAPI.checkSession();
            if (session) {
                window.location.href = session.role === 'admin' ? 'dashboard.html' : 'orders.html';
            }

            // Simple particles for login page
            (function initParticles() {
                const canvas = document.getElementById('particles-canvas');
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                const particles = [];
                const colors = ['#7B49FF', '#FF2C79', '#00FFD0'];

                for (let i = 0; i < 50; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 3 + 1,
                        speedX: (Math.random() - 0.5) * 0.5,
                        speedY: (Math.random() - 0.5) * 0.5,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        opacity: Math.random() * 0.5 + 0.2
                    });
                }

                function animate() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    particles.forEach(p => {
                        p.x += p.speedX;
                        p.y += p.speedY;

                        if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                        if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = p.opacity;
                        ctx.fill();
                    });

                    ctx.globalAlpha = 1;
                    requestAnimationFrame(animate);
                }

                animate();

                window.addEventListener('resize', () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                });
            })();

        })();
    </script>
</body>
</html>
